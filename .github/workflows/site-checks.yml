name: site-checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # brand names protected from machine translation, the rest translatable, logo alt, no unreleased product names
      - run: python .github/scripts/check_site.py
